# Compose environment overrides legacy backend settings. All writers share
# this profile and Redis. Production overrides belong in deploy/.env.
x-ml-performance-environment: &ml-performance-environment
  ML_WRITE_REQUESTS_PER_SECOND: ${ML_WRITE_REQUESTS_PER_SECOND:-4}
  ML_WRITE_MAX_REQUESTS_PER_WINDOW: ${ML_WRITE_MAX_REQUESTS_PER_WINDOW:-240}
  ML_WRITE_WINDOW_SECONDS: ${ML_WRITE_WINDOW_SECONDS:-60}
  ML_RETRY_429_COOLDOWN_SECONDS: ${ML_RETRY_429_COOLDOWN_SECONDS:-60}
  PRICE_STOCK_CHUNK_SIZE: ${PRICE_STOCK_CHUNK_SIZE:-300}
  PRICE_STOCK_CHUNK_PAUSE_SECONDS: ${PRICE_STOCK_CHUNK_PAUSE_SECONDS:-0}
  PRICE_STOCK_MAX_CONCURRENCY: ${PRICE_STOCK_MAX_CONCURRENCY:-4}
  JOB_PROGRESS_UPDATE_EVERY: ${JOB_PROGRESS_UPDATE_EVERY:-25}
  PROCESS_QUEUE_DELAY_SECONDS: ${PROCESS_QUEUE_DELAY_SECONDS:-300}
  ML_ITEM_DESCRIPTION_REQUESTS_PER_SECOND: ${ML_ITEM_DESCRIPTION_REQUESTS_PER_SECOND:-1.6666666666666667}
  ML_ITEM_DESCRIPTION_MAX_REQUESTS_PER_WINDOW: ${ML_ITEM_DESCRIPTION_MAX_REQUESTS_PER_WINDOW:-100}
  ML_ITEM_DESCRIPTION_WINDOW_SECONDS: ${ML_ITEM_DESCRIPTION_WINDOW_SECONDS:-60}
  ITEM_DESCRIPTION_CHUNK_SIZE: ${ITEM_DESCRIPTION_CHUNK_SIZE:-300}
  ITEM_DESCRIPTION_MAX_CONCURRENCY: ${ITEM_DESCRIPTION_MAX_CONCURRENCY:-4}

services:
  redis:
    image: redis:7-alpine
    container_name: compat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_api
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      <<: *ml-performance-environment
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  worker_dispatch:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_worker_dispatch
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      <<: *ml-performance-environment
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q compat_dispatch --concurrency=1 --loglevel=info

  worker_chunks:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_worker_chunks
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      <<: *ml-performance-environment
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q compat_chunks --concurrency=1 --loglevel=info

  worker_publications:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_worker_publications
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      <<: *ml-performance-environment
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q publications_sync --concurrency=1 --loglevel=info

  worker_meli_notifications:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_worker_meli_notifications
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      <<: *ml-performance-environment
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q meli_notifications --concurrency=1 --loglevel=info
    stop_grace_period: 2m

  worker_publication_exports:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_worker_publication_exports
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      <<: *ml-performance-environment
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m
    command: celery -A celery_app:celery_app worker -Q publication_exports --concurrency=${PUBLICATION_EXPORT_WORKER_CONCURRENCY:-4} --loglevel=info

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: repnet_frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  api_uploads:
  api_data:
  caddy_data:
  caddy_config:
