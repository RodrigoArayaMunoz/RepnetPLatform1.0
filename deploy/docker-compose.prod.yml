services:
  redis:
    image: redis:7-alpine
    container_name: compat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_api
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  worker_dispatch:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_worker_dispatch
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q compat_dispatch --concurrency=1 --loglevel=info

  worker_chunks:
    build:
      context: ../src/backend/compatibilties
      dockerfile: Dockerfile
    container_name: compat_worker_chunks
    working_dir: /code
    env_file:
      - ../src/backend/compatibilties/.env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /code/uploads
      TOKENS_FILE: /code/data/tokens.json
    volumes:
      - api_uploads:/code/uploads
      - api_data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A celery_app:celery_app worker -Q compat_chunks --concurrency=1 --loglevel=info

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: repnet_frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  api_uploads:
  api_data:
  caddy_data:
  caddy_config:
