name: Deploy VPS

on:
  push:
    branches:
      - calidad-revision-lc
  workflow_dispatch:
    inputs:
      notifications_only:
        description: Actualizar solo el worker de notificaciones ML sin reiniciar precios y stock
        required: false
        default: false
        type: boolean
      reset_runtime:
        description: Reiniciar colas y estados operativos antes del deploy
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate backend tests
        working-directory: src/backend/compatibilties
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Validate frontend build
        if: github.event_name != 'workflow_dispatch' || inputs.notifications_only != true
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_BRANCH: calidad-revision-lc
          NOTIFICATIONS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.notifications_only || false }}
          RESET_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_runtime || false }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            set -e
            cd \"$VPS_APP_DIR\"

            if [ \"$NOTIFICATIONS_ONLY\" = \"true\" ] && [ \"$RESET_RUNTIME\" = \"true\" ]; then
              echo '[DEPLOY BLOCKED] notifications_only no permite reset_runtime.'
              exit 1
            fi

            PROCESS_QUEUE_STATE=\$(
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T redis redis-cli --raw GET process_queue:state 2>/dev/null || true
            )
            PUBLICATION_SYNC_STATE=\$(
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T redis redis-cli --raw GET publication_sync:state 2>/dev/null || true
            )

            if [ \"$NOTIFICATIONS_ONLY\" = \"true\" ]; then
              echo '[DEPLOY] Actualizando solo worker_meli_notifications; los demas servicios siguen ejecutandose.'
            elif [ \"$RESET_RUNTIME\" = \"true\" ]; then
              PROCESS_QUEUE_WAS_RUNNING=false
              PUBLICATION_SYNC_WAS_RUNNING=false
              if echo \"\$PROCESS_QUEUE_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true'; then
                PROCESS_QUEUE_WAS_RUNNING=true
              fi
              if echo \"\$PUBLICATION_SYNC_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true'; then
                PUBLICATION_SYNC_WAS_RUNNING=true
              fi
              echo '[MAINTENANCE] Deteniendo API y workers...'
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml stop \
                api worker_dispatch worker_chunks worker_publications worker_publication_exports \
                worker_meli_notifications
              echo '[MAINTENANCE] Limpiando broker, resultados, locks y estados Redis...'
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T redis redis-cli FLUSHDB
            else
              if echo \"\$PROCESS_QUEUE_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true' || \
                 echo \"\$PUBLICATION_SYNC_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true'; then
                echo '[DEPLOY BLOCKED] Hay procesos activos. Espera a que terminen y vuelve a ejecutar el deploy.'
                exit 1
              fi
            fi

            git fetch --prune origin
            git checkout \"$DEPLOY_BRANCH\"
            git reset --hard \"origin/$DEPLOY_BRANCH\"

            if [ \"$NOTIFICATIONS_ONLY\" = \"true\" ]; then
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                up -d --build --no-deps --force-recreate worker_meli_notifications
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                ps worker_meli_notifications
              exit 0
            fi

            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml build --no-cache frontend
            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build --force-recreate --remove-orphans

            echo '[DEPLOY] Comprobando la politica de precios/stock y descripciones en API y workers...'
            EXPECTED_PROFILE=\$(docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
              exec -T api python -m scripts.check_price_stock_config)
            echo \"\$EXPECTED_PROFILE\"
            for SERVICE in worker_dispatch worker_chunks worker_publications worker_publication_exports worker_meli_notifications; do
              ACTUAL_PROFILE=\$(docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T \"\$SERVICE\" python -m scripts.check_price_stock_config)
              if [ \"\$ACTUAL_PROFILE\" != \"\$EXPECTED_PROFILE\" ]; then
                echo \"[DEPLOY FAILED] Configuracion de escritura diferente en \$SERVICE.\"
                exit 1
              fi
            done

            if [ \"$RESET_RUNTIME\" = \"true\" ]; then
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T \
                -e RESUME_PROCESS_QUEUE=\"\$PROCESS_QUEUE_WAS_RUNNING\" \
                -e RESUME_PUBLICATION_SYNC=\"\$PUBLICATION_SYNC_WAS_RUNNING\" \
                api python -m scripts.reset_runtime_state
            fi

            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml ps
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              https://repnet.online/api/webhooks/mercadolibre/health
            docker image prune -f
          "
