name: Deploy VPS

on:
  push:
    branches:
      - calidad-revision-lc
  workflow_dispatch:
    inputs:
      reset_runtime:
        description: Reiniciar colas y estados operativos antes del deploy
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_BRANCH: calidad-revision-lc
          RESET_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_runtime || false }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            set -e
            cd \"$VPS_APP_DIR\"

            PROCESS_QUEUE_STATE=\$(
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T redis redis-cli --raw GET process_queue:state 2>/dev/null || true
            )
            PUBLICATION_SYNC_STATE=\$(
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T redis redis-cli --raw GET publication_sync:state 2>/dev/null || true
            )

            if [ \"$RESET_RUNTIME\" = \"true\" ]; then
              PROCESS_QUEUE_WAS_RUNNING=false
              PUBLICATION_SYNC_WAS_RUNNING=false
              if echo \"\$PROCESS_QUEUE_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true'; then
                PROCESS_QUEUE_WAS_RUNNING=true
              fi
              if echo \"\$PUBLICATION_SYNC_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true'; then
                PUBLICATION_SYNC_WAS_RUNNING=true
              fi
              echo '[MAINTENANCE] Deteniendo API y workers...'
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml stop \
                api worker_dispatch worker_chunks worker_publications worker_publication_exports \
                worker_meli_notifications
              echo '[MAINTENANCE] Limpiando broker, resultados, locks y estados Redis...'
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T redis redis-cli FLUSHDB
            else
              if echo \"\$PROCESS_QUEUE_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true' || \
                 echo \"\$PUBLICATION_SYNC_STATE\" | grep -Eq '\"running\"[[:space:]]*:[[:space:]]*true'; then
                echo '[DEPLOY BLOCKED] Hay procesos activos. Espera a que terminen o ejecuta el workflow manual con reset_runtime=true.'
                exit 1
              fi
            fi

            git fetch --prune origin
            git checkout \"$DEPLOY_BRANCH\"
            git reset --hard \"origin/$DEPLOY_BRANCH\"
            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml build --no-cache frontend
            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build --force-recreate --remove-orphans

            if [ \"$RESET_RUNTIME\" = \"true\" ]; then
              docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml \
                exec -T \
                -e RESUME_PROCESS_QUEUE=\"\$PROCESS_QUEUE_WAS_RUNNING\" \
                -e RESUME_PUBLICATION_SYNC=\"\$PUBLICATION_SYNC_WAS_RUNNING\" \
                api python -m scripts.reset_runtime_state
            fi

            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml ps
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              https://repnet.online/api/webhooks/mercadolibre/health
            docker image prune -f
          "
